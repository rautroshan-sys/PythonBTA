{% extends "base.html" %}
{% block title %}Create account — Extractly{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h2>Create account</h2>
    <p class="auth-sub">Optional — it only saves your history.</p>
    <form id="signup-form">
      <label class="field-label" for="name">Name</label>
      <input class="field-input" type="text" id="name" name="name" required>

      <label class="field-label" for="email">Email</label>
      <input class="field-input" type="email" id="email" name="email" required>

      <label class="field-label" for="password">Password</label>
      <input class="field-input" type="password" id="password" name="password" required>

      <button type="submit" class="btn btn-primary btn-wide">Create account</button>
    </form>
    <p class="modal-switch">
      <span>Already have an account?</span>
      <a href="/login" class="link-btn">Log in</a>
    </p>
  </div>
</section>
{% endblock %}
