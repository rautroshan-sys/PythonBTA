<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Extractly{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">
        <span class="logo-mark">⟡</span>
        <span class="logo-text">Extractly</span>
      </a>
      <div class="auth-controls">
        {% if logged_in %}
          <a href="/history" class="btn btn-ghost">My extractions</a>
          <div class="account-pill"><span class="account-initial">{{ (current_user.name or current_user.email)[0] | upper }}</span></div>
        {% else %}
          <a href="/login" class="btn btn-ghost">Log in</a>
          <a href="/signup" class="btn btn-primary">Register</a>
        {% endif %}
      </div>
    </div>
  </header>

  <div class="app-layout">
    <main class="app-main">
      {% block content %}{% endblock %}
    </main>

    <div class="chat-panel" id="chat-panel">
      <div class="chat-panel-header">
        <span id="chat-panel-title">Upload a document to start</span>
        <button class="modal-close" id="chat-close">×</button>
      </div>
      <div id="chat-log"></div>
      <div class="chat-panel-input">
        <input type="text" id="question-input" class="field-input" placeholder="Ask a question...">
        <button class="btn btn-primary" id="ask-btn">Ask</button>
      </div>
    </div>
  </div>

  <button class="chat-toggle-btn" id="chat-toggle">💬 Chat</button>

  <footer class="site-footer">
    <p>Extractly · text stays on your run, nothing is shared</p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
