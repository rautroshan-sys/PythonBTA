{% extends "base.html" %}
{% block title %}Log in — Extractly{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h2>Log in</h2>
    <form id="login-form" method="POST" action="/login">
      <label class="field-label" for="email">Email</label>
      <input class="field-input" type="email" id="email" name="email" placeholder="you@example.com" required>

      <label class="field-label" for="password">Password</label>
      <input class="field-input" type="password" id="password" name="password" placeholder="••••••••" required>

      <button type="submit" class="btn btn-primary btn-wide">Log in</button>
    </form>
    <p class="modal-switch">
      <span>Don't have an account?</span>
      <a href="/register" class="link-btn">Register</a>
    </p>
  </div>
</section>
{% endblock %}
